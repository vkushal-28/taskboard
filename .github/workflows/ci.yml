name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

# Pinned: on ubuntu-latest (Ubuntu 26.04) Chromium's system packages take minutes to install.
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # mongodb-memory-server downloads mongod (~77 MB) on the first test run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test (api with coverage thresholds)
        run: pnpm --filter @taskboard/api test:coverage
      - name: Test (web and shared)
        run: pnpm --filter '!@taskboard/api' test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 14
      - run: pnpm build

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Production dependencies only: a dev-only advisory can't reach users, and Dependabot
      # picks those up without blocking every PR.
      - run: pnpm audit --prod --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mongo:
        # Not mongo:8 (8.3): MongoDB 8.3+ refuses to start on the runners' Linux 6.19+ kernel
        # (SERVER-121912). 8.2 runs there, like the mongod the api tests download.
        image: mongo:8.2
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @taskboard/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @taskboard/e2e exec playwright install --with-deps chromium
      # The browser is cached, but its system libraries are not.
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @taskboard/e2e exec playwright install-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
