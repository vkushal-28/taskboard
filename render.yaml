# Render Blueprint for the api (ADR 018). Secrets marked `sync: false` are asked for once,
# when the Blueprint is first created; change them later on the Render dashboard.
services:
  - type: web
    name: taskboard-api
    runtime: docker
    plan: free
    # Keep the Atlas cluster in a nearby region.
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploys are triggered after CI passes (Slice 7.2), not on every push.
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: LOG_LEVEL
        value: info
      # The Vercel production URL, e.g. https://taskboard.vercel.app. CORS, the Origin check,
      # the socket handshake and invite links all use it.
      - key: CLIENT_URL
        sync: false
      # Atlas connection string (mongodb+srv://...).
      - key: MONGODB_URI
        sync: false
      # A random 256-bit base64 value (44 characters), generated by Render.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # The browser reaches the api through Vercel at /api (refresh cookie path).
      - key: API_PUBLIC_PATH
        value: /api
      # Vercel and Render's own proxy in front of the api. Confirmed after the first deploy
      # (Slice 7.2): too high lets clients fake their IP for the rate limits.
      - key: TRUST_PROXY
        value: '2'
